name: deploy to ec2

on:
  push: 
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST || 'ubuntu'}}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/level5
            git pull
            sudo docker compose down
            sudo docker compose up -d --build